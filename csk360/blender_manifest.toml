schema_version = "1.0.0"

id = "csk360"
version = "0.1.0"
name = "CSK360 Creator Shortcuts Kit"
tagline = "Animate characters with clips, moves and dialogue, not keyframes"
maintainer = "Lojith"
type = "add-on"

tags = ["Animation", "Rigging", "Sequencer"]

# Supported and tested on Blender 5.3 only for now; older versions later.
blender_version_min = "5.3.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Lojith and CSK360 contributors"]

[permissions]
files = "Read dialogue audio and write generated voices to the voice folder"
network = "Download offline voice models and Rhubarb lip sync when you press Install Voices"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "/.git/"]
